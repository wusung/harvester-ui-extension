typeDescription:
  harvester: 品牌化允許管理員透過自訂 Harvester 產品名稱、標誌和配色方案來全面重新品牌化使用者介面。
advancedSettings:
  experimental: 實驗性功能允許使用者在正式支援的版本之前測試和評估早期存取功能
  descriptions:
    'harv-vlan': VLAN 網路的預設網路介面名稱。
    'harv-backup-target': 用於儲存虛擬機器備份的自訂備份目標。
    'branding': 品牌化允許管理員透過自訂 Harvester 產品名稱、標誌和配色方案來全面重新品牌化使用者介面。
    'harv-csi-driver-config': 為 CSI 驅動程式設定其他資訊。
    'harv-csi-online-expand-validation': 允許特定 CSI 驅動程式的線上磁碟區擴充。
    'harv-containerd-registry': Containerd 登錄設定以連線到私有登錄。
    'harv-log-level': 設定 Harvester 伺服器日誌層級。預設為資訊。
    'harv-server-version': Harvester 伺服器版本。
    'harv-upgrade-checker-enabled': 指定是否啟用 Harvester 升級檢查。預設為 True。
    'harv-upgrade-checker-url': 預設 Harvester 升級檢查 URL。僅在 <code>upgrade-checker-enabled</code> 等於 True 時使用。
    'harv-ui-source': 設定如何載入使用者介面來源。
    'harv-ui-index': 使用者介面的 HTML 索引位置。
    'harv-cluster-registration-url': 多叢集管理的註冊 URL。
    'harv-http-proxy': Harvester 存取外部服務的 HTTP 代理。
    'harv-additional-ca': 用於 TLS 驗證的自訂 CA 根憑證。
    'harv-overcommit-config': 資源過度配置設定。
    'harv-support-bundle-timeout': 以分鐘為單位的支援包逾時設定，使用 0 以停用逾時。
    'harv-support-bundle-expiration': 以分鐘為單位的支援包過期設定。
    'harv-support-bundle-node-collection-timeout': 以分鐘為單位的支援包節點收集逾時設定。
    'harv-vm-force-reset-policy': 當虛擬機器卡在故障節點上時強制重設操作的設定。
    'harv-ssl-parameters': 用於 TLS 驗證的自訂 SSL 參數。
    'harv-storage-network': Longhorn storage-network 設定。
    'harv-support-bundle-namespaces': 選擇要包含在支援包中的其他命名空間。
    'harv-auto-disk-provision-paths': 指定 Harvester 將自動新增為虛擬機器儲存的磁碟（使用 glob 模式）。
    'harv-support-bundle-image': 支援包映像檔設定。在 <a href="https://hub.docker.com/r/rancher/support-bundle-kit/tags" target="_blank">rancher/support-bundle-kit</a> 中尋找不同版本。
    'harv-release-download-url': 此設定允許您設定 <code>升級版本下載</code> URL 位址。Harvester 將從設定的 URL 託管的（<code>$URL</code>/<code>$VERSION</code>/version.yaml）檔案中取得 ISO URL 和校驗和值。
    'harv-default-vm-termination-grace-period-seconds': 設定虛擬機器停止的虛擬機器終止寬限期。
    'harv-ntp-servers': 設定 NTP 伺服器。您可以設定多個 IPv4 位址或主機位址。
    'harv-auto-rotate-rke2-certs': 憑證輪替機制依賴 Rancher。Harvester 將自動更新憑證產生以觸發輪替。
    'harv-kubeconfig-default-token-ttl-minutes': 套用於 Harvester 管理 kubeconfig 檔案的 TTL（以分鐘為單位）。預設為 0，表示永不過期。
    'harv-longhorn-v2-data-engine-enabled': 啟用 Longhorn V2 資料引擎。預設為 false。<ul><li>變更此設定將在所有節點上重新啟動 RKE2。這不會影響執行中的虛擬機器工作負載。</li><li>如果在啟用此設定時看到「hugepages-2Mi 
      容量不足」錯誤，請稍候一分鐘等待錯誤清除。如果錯誤持續存在，請重新開機受影響的節點。</li></ul>
    'harv-additional-guest-memory-overhead-ratio': kubevirt 調整虛擬機器額外負荷記憶體的比率。此值可以是零、空值或介於 1.0 和 10.0 之間的浮點數，預設為 1.5。
    'harv-upgrade-config': 設定升級的映像檔預載和虛擬機器還原選項。請參閱 <a href="{url}" target="_blank" rel="noopener">settings/upgrade-config</a> 中的相關欄位
    'harv-vm-migration-network': 虛擬機器遷移流量的隔離網路。
    'harv-rancher-cluster': 設定 Rancher 叢集整合設定以進行客體叢集管理。
    'harv-max-hotplug-ratio': kubevirt 限制可以熱插拔到虛擬機器的最大 CPU 和記憶體的比率。此值可以是介於 1 和 20 之間的整數，預設為 4。
    'harv-kubevirt-migration': 配置叢集範圍的 KubeVirt 即時遷移參數。
