      'cattle-monitoring-system/rancher-monitoring': rancher-monitoring 是一個附加元件，可收集 Harvester 叢集和虛擬機器指標，並允許您在內嵌儀表板上檢視指標並將警示傳送到遠端伺服器。
      'vm-import-controller': vm-import-controller 是一個附加元件，可協助將虛擬機器工作負載從其他來源叢集遷移到現有的 Harvester 叢集。
      'pcidevices-controller': pcidevices-controller 是一個附加元件，可協助探索叢集中節點的 PCI 裝置，並允許使用者準備裝置以進行 PCI 穿透，以與 Harvester 虛擬機器和客體叢集搭配使用。
      'nvidia-driver-toolkit': nvidia-driver-toolkit 是一個附加元件，可啟用 vGPU 裝置並將它們指派給 Harvester 虛擬機器。
      'rancher-logging': rancher-logging 是一個附加元件，可從 Harvester 叢集收集各種日誌、事件和稽核，並根據流程將它們路由到多種伺服器。
      'rancher-monitoring': rancher-monitoring 是一個附加元件，可收集 Harvester 叢集和虛擬機器指標、在內嵌儀表板上檢視它們，並將警示傳送到遠端伺服器。
      'rancher-vcluster': rancher-vcluster 部署已安裝 Rancher 的虛擬叢集（vcluster）。
      'harvester-seeder': harvester-seeder 是一個附加元件，使用 IPMI 和 Redfish 來探索硬體資訊並執行頻外操作。
      'harvester-system/harvester-seeder': harvester-seeder 是一個附加元件，使用 IPMI 和 Redfish 來探索硬體資訊並執行頻外操作。
      'harvester-csi-driver-lvm': harvester-csi-driver-lvm 是一個附加元件，允許使用者透過使用本機裝置的 LVM 建立 PVC。
      'descheduler': 虛擬機器自動平衡透過根據管理員定義的策略驅逐未最佳放置的 Pod 來最佳化工作負載調度。
